apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/flux
  # Flux controllers, CRDs and namespace must survive Git/path deletions.
  prune: false
  deletionPolicy: Orphan
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/gateway-api
  # Retain shared APIs and their instances when a Git path is removed.
  prune: false
  deletionPolicy: Orphan
  wait: true
  dependsOn:
    - name: flux
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 20m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/cilium
  # Deleting the HelmRelease would uninstall the cluster's network.
  prune: false
  deletionPolicy: Orphan
  wait: true
  # Establish the controllers and Gateway API CRDs before enabling Cilium's controller.
  dependsOn:
    - name: flux
    - name: gateway-api
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
        optional: false
