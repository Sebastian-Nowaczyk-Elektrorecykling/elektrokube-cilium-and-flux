# Match elektrokube-scripts/lib/config.py:cilium_values for initial adoption.
# Cluster-specific strings are supplied by flux-system/cluster-settings.
cluster:
  name: "${CLUSTER_NAME}"
kubeProxyReplacement: true
k8sServiceHost: "${API_IP}"
k8sServicePort: 6443
ipam:
  mode: kubernetes
routingMode: tunnel
tunnelProtocol: vxlan
bpf:
  masquerade: true
l7Proxy: true
envoy:
  enabled: true
  securityContext:
    capabilities:
      # Host-network listeners normally bind to the privileged ingress ports 80 and 443.
      keepCapNetBindService: true
      envoy:
        - NET_ADMIN
        - SYS_ADMIN
        - NET_BIND_SERVICE
gatewayAPI:
  enabled: true
  # Expose Gateway listeners directly on every Cilium node's host IP.
  # This replaces the need to advertise LoadBalancer IPs with L2 or BGP.
  hostNetwork:
    enabled: true
  gatewayClass:
    create: true
ipv4:
  enabled: true
ipv6:
  enabled: false
operator:
  replicas: 1
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
hubble:
  enabled: true
  relay:
    enabled: true
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
  ui:
    enabled: true
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
