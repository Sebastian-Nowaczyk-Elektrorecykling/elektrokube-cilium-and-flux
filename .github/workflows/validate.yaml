name: Validate cluster foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        run: bash tests/install-tools.sh
      - name: Install validation dependency
        run: python3 -m pip install PyYAML==6.0.3
      - name: Render Cilium and validate all schemas
        run: python3 tests/validate.py
